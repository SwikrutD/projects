<main id="app">
  <!-- ============ catalogue view ============ -->
  <section id="view-list">
    <div class="wrap hero">
      <div class="hero-copy">
        <p class="kicker">Built by Swikrut Dhanorkar</p>
        <h1>Things I've made.</h1>

      </div>
      <div class="carousel" id="carousel" aria-roledescription="carousel" aria-label="Featured projects">
        <div class="car-track" id="car-track"></div>
        <button class="car-btn prev" type="button" aria-label="Previous project"><i class="fa-solid fa-chevron-left"></i></button>
        <button class="car-btn next" type="button" aria-label="Next project"><i class="fa-solid fa-chevron-right"></i></button>
        <div class="car-dots" id="car-dots" role="tablist" aria-label="Choose a featured project"></div>
      </div>
    </div>

    <div class="wrap">
      <div class="controls">
        <div class="tabs" id="tabs" role="tablist" aria-label="Categories"></div>
        <label class="search">
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>

          <kbd>/</kbd>
        </label>
      </div>

      <div id="sections"></div>
      <p class="empty" id="empty" hidden>Nothing matches that search.</p>
